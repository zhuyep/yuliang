name: Synthetic demo
on:
  push:
    branches: [main]
    paths: ['demo/**', 'lib/analysis.mjs', 'favicon.svg', 'scripts/build-demo.mjs', 'tests/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Build the public asset allowlist
        id: demo
        run: |
          DEMO_DIRECTORY=$(node scripts/build-demo.mjs)
          echo "path=$DEMO_DIRECTORY" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.demo.outputs.path }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish synthetic demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
